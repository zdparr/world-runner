# Render Blueprint: one Node web service + one Postgres instance.
# preDeployCommand requires a paid web service plan (Starter or above).
databases:
  - name: narrator-db
    databaseName: narrator
    user: narrator
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: narrator
    runtime: node
    plan: starter
    region: oregon
    # Dev dependencies (vite, esbuild, tailwind) are needed to build, even with NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: narrator-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      # Claude fallback: used only when LLM_BASE_URL is unset.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Self-hosted model on the tailnet (Ollama on the tag:llm machine). `npm start` joins the
      # tailnet with TS_AUTHKEY (a reusable, ephemeral auth key tagged tag:render) and model calls
      # go through tailscaled's local proxy.
      #
      # CURRENTLY OFF: running on Claude until the RTX 3090 desktop is set up. To switch back to the
      # self-hosted model, uncomment the block below and set both model names to gemma4:26b.
      # Removing a key here does not delete it from the Render service: delete LLM_BASE_URL and
      # LLM_PROXY_URL in the dashboard too (LLM_PROXY_URL would route Claude calls through the tailnet).
      - key: TS_AUTHKEY
        sync: false
      # - key: LLM_BASE_URL
      #   value: http://tron-laptop.tail57bc3.ts.net:11434
      # - key: LLM_PROXY_URL
      #   value: http://127.0.0.1:1055
      # # Must match OLLAMA_CONTEXT_LENGTH on the model host.
      # - key: LLM_CONTEXT_TOKENS
      #   value: "32768"
      # # Narrator reasoning budget: slower turns, much better prose and tool use (0 = off).
      # - key: LLM_THINKING_TOKENS
      #   value: "4000"
      - key: NARRATOR_MODEL
        value: claude-sonnet-5
      - key: UTILITY_MODEL
        value: claude-haiku-4-5-20251001
