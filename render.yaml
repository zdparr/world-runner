# Render Blueprint: one Node web service + one Postgres instance.
# preDeployCommand requires a paid web service plan (Starter or above).
databases:
  - name: narrator-db
    databaseName: narrator
    user: narrator
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: narrator
    runtime: node
    plan: starter
    region: oregon
    # Dev dependencies (vite, esbuild, tailwind) are needed to build, even with NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: narrator-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      # Claude fallback: used only when LLM_BASE_URL is unset.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Self-hosted model on the tailnet (Ollama on the tag:llm machine). `npm start` joins the
      # tailnet with TS_AUTHKEY (a reusable, ephemeral auth key tagged tag:render) and model calls
      # go through tailscaled's local proxy. Remove LLM_BASE_URL and set the Claude model names to
      # switch back to Claude.
      - key: TS_AUTHKEY
        sync: false
      - key: LLM_BASE_URL
        value: http://tron-laptop.tail57bc3.ts.net:11434
      - key: LLM_PROXY_URL
        value: http://127.0.0.1:1055
      - key: NARRATOR_MODEL
        value: qwen3:30b-a3b-instruct-2507-q4_K_M
      - key: UTILITY_MODEL
        value: qwen3:30b-a3b-instruct-2507-q4_K_M
