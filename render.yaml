# Render Blueprint: one Node web service + one Postgres instance.
# preDeployCommand requires a paid web service plan (Starter or above).
databases:
  - name: narrator-db
    databaseName: narrator
    user: narrator
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: narrator
    runtime: node
    plan: starter
    region: oregon
    # Dev dependencies (vite, esbuild, tailwind) are needed to build, even with NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: narrator-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NARRATOR_MODEL
        value: claude-sonnet-5
      - key: UTILITY_MODEL
        value: claude-haiku-4-5-20251001
